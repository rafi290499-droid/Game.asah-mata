<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASAH MATA</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #1a1a2e, #16213e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #0f1729;
    border-radius: 20px;
    padding: 20px 16px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }
  h1 {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 0 0 2px;
  }
  .sub {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    letter-spacing: 0.8px;
    color: #8a93a8;
    margin: 0 0 14px;
  }
  .top-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .sound-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 6px 10px;
  }
  .sound-toggle span { font-size: 15px; cursor: pointer; }
  .sound-toggle input[type="range"] {
    width: 70px;
    accent-color: #ffd166;
  }
  .stats-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
  }
  .stat-label { font-size: 10px; color: #8a93a8; }
  .stat-value { font-size: 18px; font-weight: 700; color: #ffd166; }
  #board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    border-radius: 14px;
    padding: 8px;
    aspect-ratio: 1;
    filter: blur(0px);
    transition: filter 0.2s;
  }
  #board.locked { filter: blur(4px); pointer-events: none; }
  .tile {
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: transform 0.12s, opacity 0.15s, border-color 0.15s;
  }
  .tile.selected {
    border: 2px solid #ffd166;
    transform: scale(0.92);
  }
  .tile.hint {
    border: 2px solid #6ee7b7;
    animation: pulse 0.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .msg {
    text-align: center;
    font-size: 14px;
    min-height: 20px;
    margin: 12px 0 2px;
    font-weight: 600;
    color: #6ee7b7;
  }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.secondary {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  button:disabled { opacity: 0.4; }
  button:active { transform: scale(0.97); }
  .history {
    text-align: center;
    font-size: 12px;
    color: #8a93a8;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .history .arrow-up { color: #6ee7b7; font-weight: 700; }
  .history .arrow-down { color: #ef4444; font-weight: 700; }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: #5a6378;
    margin-top: 10px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(6,9,15,0.94);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0 0 8px;
  }
  .overlay-score-label { font-size: 12px; color: #8a93a8; margin-top: 16px; }
  .overlay-score-value { font-size: 34px; font-weight: 700; color: #ffd166; margin: 4px 0 6px; }
  .overlay-compare { font-size: 13px; margin-bottom: 16px; }
  .overlay button { max-width: 220px; }
  #startBtn {
    width: auto;
    flex: none;
    padding: 10px 32px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .start-logo {
    max-width: 200px;
    width: 70%;
    height: auto;
    margin: 4px 0 18px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }

<script>
  const SIZE = 7;
  const symbols = ["🍒", "🍋", "🔔", "⭐", "🍇", "🍉"];
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const timerEl = document.getElementById("timer");
  const hintsLeftEl = document.getElementById("hintsLeft");
  const msgEl = document.getElementById("msg");
  const startOverlay = document.getElementById("startOverlay");
  const endOverlay = document.getElementById("endOverlay");
  const startBtn = document.getElementById("startBtn");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const hintBtn = document.getElementById("hintBtn");
  const highScoreValueEl = document.getElementById("highScoreValue");
  const compareTextEl = document.getElementById("compareText");
  const historyBox = document.getElementById("historyBox");
  const volumeSlider = document.getElementById("volumeSlider");
  const muteIcon = document.getElementById("muteIcon");

  const HIGH_SCORE_KEY = "asah_mata_high_score";
  const LAST_SCORE_KEY = "asah_mata_last_score";
  const MAX_HINTS = 3;

  let grid = [];
  let score = 0;
  let timeLeft = 60;
  let selected = null;
  let busy = false;
  let running = false;
  let timerHandle = null;
  let hintsLeft = MAX_HINTS;
  let hintTiles = null;

  // ---- Audio (dibuat langsung via Web Audio API, tanpa file eksternal) ----
  let audioCtx = null;
  let musicGain = null;
  let musicTimer = null;
  let musicStep = 0;
  const musicNotes = [261.6, 329.6, 392.0, 329.6, 440.0, 392.0, 329.6, 293.7];

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = (parseInt(volumeSlider.value) / 100) * 0.15;
      musicGain.connect(audioCtx.destination);
    }
  }

  function playClickSound() {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 520;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
    osc.stop(audioCtx.currentTime + 0.13);
  }

  function playMatchSound() {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 740;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
    osc.stop(audioCtx.currentTime + 0.22);
  }

  function startMusic() {
    ensureAudio();
    musicStep = 0;
    stopMusic();
    musicTimer = setInterval(() => {
      const freq = musicNotes[musicStep % musicNotes.length];
      musicStep++;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      g.gain.value = 1;
      osc.connect(g);
      g.connect(musicGain);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.stop(audioCtx.currentTime + 0.36);
    }, 380);
  }

  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  volumeSlider.addEventListener("input", () => {
    const v = parseInt(volumeSlider.value);
    if (musicGain) musicGain.gain.value = (v / 100) * 0.15;
    muteIcon.textContent = v === 0 ? "🔇" : "🔊";
  });

  muteIcon.addEventListener("click", () => {
    if (volumeSlider.value !== "0") {
      volumeSlider.dataset.prev = volumeSlider.value;
      volumeSlider.value = 0;
    } else {
      volumeSlider.value = volumeSlider.dataset.prev || 50;
    }
    volumeSlider.dispatchEvent(new Event("input"));
  });

  // ---- Riwayat skor ----
  function getHighScore() { return parseInt(localStorage.getItem(HIGH_SCORE_KEY)) || 0; }
  function getLastScore() { return localStorage.getItem(LAST_SCORE_KEY); }

  function renderHistory() {
    const last = getLastScore();
    if (last === null) {
      historyBox.textContent = "Skor terakhir: belum ada";
    } else {
      historyBox.textContent = "Skor terakhir: " + last;
    }
  }

  // ---- Logika grid ----
  function randomSymbol() { return symbols[Math.floor(Math.random() * symbols.length)]; }

  function createGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) row.push(randomSymbol());
      grid.push(row);
    }
    while (findMatches().length > 0) {
      findMatches().forEach(([r, c]) => grid[r][c] = randomSymbol());
    }
  }

  function findMatches(sourceGrid) {
    const g = sourceGrid || grid;
    const matched = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE - 2; c++) {
        const s = g[r][c];
        if (s && s === g[r][c+1] && s === g[r][c+2]) matched.push([r,c],[r,c+1],[r,c+2]);
      }
    }
    for (let c = 0; c < SIZE; c++) {
      for (let r = 0; r < SIZE - 2; r++) {
        const s = g[r][c];
        if (s && s === g[r+1][c] && s === g[r+2][c]) matched.push([r,c],[r+1,c],[r+2,c]);
      }
    }
    const unique = [], seen = new Set();
    matched.forEach(([r,c]) => {
      const key = r + "," + c;
      if (!seen.has(key)) { seen.add(key); unique.push([r,c]); }
    });
    return unique;
  }

  function render() {
    boardEl.innerHTML = "";
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const div = document.createElement("div");
        div.className = "tile";
        div.textContent = grid[r][c] || "";
        if (selected && selected[0] === r && selected[1] === c) div.classList.add("selected");
        if (hintTiles && hintTiles.some(([hr,hc]) => hr === r && hc === c)) div.classList.add("hint");
        div.addEventListener("click", () => onTileClick(r, c));
        boardEl.appendChild(div);
      }
    }
    scoreEl.textContent = score;
    timerEl.textContent = timeLeft;
    hintsLeftEl.textContent = hintsLeft;
    hintBtn.disabled = hintsLeft <= 0 || !running || busy;
  }

  function isAdjacent(a, b) {
    return (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1])) === 1;
  }

  function swapInGrid(g, a, b) {
    const tmp = g[a[0]][a[1]];
    g[a[0]][a[1]] = g[b[0]][b[1]];
    g[b[0]][b[1]] = tmp;
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

  async function onTileClick(r, c) {
    if (busy || !running) return;
    hintTiles = null;

    if (!selected) { selected = [r, c]; render(); return; }
    if (selected[0] === r && selected[1] === c) { selected = null; render(); return; }
    if (!isAdjacent(selected, [r, c])) { selected = [r, c]; render(); return; }

    const a = selected, b = [r, c];
    selected = null;
    busy = true;
    playClickSound();

    swapInGrid(grid, a, b);
    render();

    let matches = findMatches();
    if (matches.length === 0) {
      await sleep(150);
      swapInGrid(grid, a, b);
      render();
      busy = false;
      return;
    }

    await resolveMatches();
    busy = false;
  }

  async function resolveMatches() {
    let matches = findMatches();
    while (matches.length > 0) {
      score += matches.length * 10;
      msgEl.textContent = "+" + (matches.length * 10) + " poin";
      playMatchSound();
      matches.forEach(([r, c]) => grid[r][c] = null);
      render();
      await sleep(180);
      dropTiles();
      render();
      await sleep(130);
      matches = findMatches();
    }
  }

  function dropTiles() {
    for (let c = 0; c < SIZE; c++) {
      let pointer = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (grid[r][c] !== null) { grid[pointer][c] = grid[r][c]; pointer--; }
      }
      for (let r = pointer; r >= 0; r--) grid[r][c] = randomSymbol();
    }
  }

  // ---- Petunjuk / bantuan ----
  function findHintMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const neighbors = [[r, c+1], [r+1, c]];
        for (const [nr, nc] of neighbors) {
          if (nr >= SIZE || nc >= SIZE) continue;
          const testGrid = grid.map(row => row.slice());
          swapInGrid(testGrid, [r, c], [nr, nc]);
          if (findMatches(testGrid).length > 0) {
            return [[r, c], [nr, nc]];
          }
        }
      }
    }
    return null;
  }

  function useHint() {
    if (hintsLeft <= 0 || busy || !running) return;
    const move = findHintMove();
    if (!move) {
      msgEl.textContent = "Tidak ada langkah, papan diacak ulang";
      createGrid();
      render();
      return;
    }
    hintsLeft -= 1;
    hintTiles = move;
    render();
    setTimeout(() => {
      hintTiles = null;
      render();
    }, 2500);
  }

  function tick() {
    timeLeft -= 1;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }

  function startGame() {
    ensureAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();
    score = 0;
    timeLeft = 60;
    hintsLeft = MAX_HINTS;
    selected = null;
    hintTiles = null;
    msgEl.textContent = "";
    running = true;
    createGrid();
    boardEl.classList.remove("locked");
    render();
    startOverlay.classList.add("hidden");
    endOverlay.classList.add("hidden");
    timerHandle = setInterval(tick, 1000);
    startMusic();
  }

  function endGame() {
    running = false;
    clearInterval(timerHandle);
    stopMusic();
    boardEl.classList.add("locked");

    const previousLast = getLastScore();
    let compareHtml = "";
    if (previousLast !== null) {
      const prev = parseInt(previousLast);
      if (score > prev) {
        compareHtml = "<span class='arrow-up'>&#9650;</span> Lebih tinggi dari sebelumnya (" + prev + ")";
      } else if (score < prev) {
        compareHtml = "<span class='arrow-down'>&#9660;</span> Lebih rendah dari sebelumnya (" + prev + ")";
      } else {
        compareHtml = "Sama seperti sebelumnya (" + prev + ")";
      }
    } else {
      compareHtml = "Ini permainan pertamamu";
    }
    compareTextEl.innerHTML = compareHtml;

    if (score > getHighScore()) localStorage.setItem(HIGH_SCORE_KEY, score);
    localStorage.setItem(LAST_SCORE_KEY, score);
    renderHistory();

    highScoreValueEl.textContent = getHighScore();
    endOverlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);
  playAgainBtn.addEventListener("click", startGame);
  hintBtn.addEventListener("click", useHint);

  renderHistory();
  createGrid();
  render();
</script>
</body>
</html>
